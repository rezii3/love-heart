<main class="app-container">
  <!-- Main Animated Heart Canvas Component -->
  <app-heart [started]="hasStarted()"></app-heart>

  <!-- Start Screen Overlay (Required for Browser Audio Autoplay Policy) -->
  @if (!hasStarted()) {
    <div class="start-overlay" (click)="startExperience()">
      <div class="start-card" (click)="$event.stopPropagation()">
        <div class="title-glow">Love Heart</div>
        <p class="subtitle">მიყვარხარ ჩემო პატარავვ</p>
        <button
          type="button"
          class="begin-btn"
          (click)="startExperience()"
        >
          დააჭირე მარიამმ 
        </button>
      </div>
    </div>
  }

  <!-- Corner Mute / Unmute Button -->
  @if (hasStarted()) {
    <button
      type="button"
      class="mute-btn"
      (click)="toggleMute()"
      [attr.aria-label]="musicService.isMuted() ? 'Unmute music' : 'Mute music'"
      [title]="musicService.isMuted() ? 'Unmute music' : 'Mute music'"
    >
      @if (musicService.isMuted()) {
        <span>🔇 Muted</span>
      } @else {
        <span>🔊 Music</span>
      }
    </button>
  }
</main>
